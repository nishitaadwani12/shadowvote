# Fly.io config for the ShadowVote WebSocket server.
# Deploy: fly launch --no-deploy   (once)  then  fly deploy
# Secrets: fly secrets set DATABASE_URL=... GEMINI_API_KEY=...
app = "shadowvote"
primary_region = "iad"

[build]
  dockerfile = "packages/server/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
